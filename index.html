<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>交换站</title>
<link rel="stylesheet" href="style.css?v=20261126CLD9">
</head>
<body>
<div class="wrap">
<header>
  <h1>交换站</h1>
  <div class="sub"></div>
  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><i>条目总数</i></div>
    <div class="stat"><b id="sList">0</b><i>条目条数</i></div>
    <div class="stat"><b id="sPlayers">0</b><i>成员</i></div>
  </div>
</header>

<div class="card" id="meCard">
  <div class="lenflex" style="margin:0">
    <div><div class="muted">当前身份</div><div id="meName" style="font-weight:600;font-size:15px">未登录</div></div>
    <div class="row" style="flex:0 0 auto">
      <button class="btn mini" id="authBtn" onclick="openAuth()">登录 / 注册</button>
      <button class="btn ghost mini hidden" id="logoutBtn" onclick="logout()">退出</button>
    </div>
  </div>
  <div class="muted" id="meHint" style="margin-top:6px"></div>
</div>

<div class="tabs" id="tabs">
  <div class="tab on" data-v="upload">上传</div>
  <div class="tab" data-v="market">市场</div>
  <div class="tab" data-v="match">匹配</div>
  <div class="tab" data-v="inbox">意向</div>
  <div class="tab" data-v="catalog">图鉴</div>
  <div class="tab" data-v="mine">我的</div>
</div>

<!-- ========== 上传 ========== -->
<div class="view" id="v-upload">
  <div class="card">
    <h3>上传截图</h3>
    
    <input type="file" id="file" accept="image/*" multiple style="display:none">
    <button class="btn" id="pickBtn">选择截图</button>
    <span class="muted" id="upHint" style="margin-left:8px"></span>
  </div>
  <div class="card hidden" id="resultCard">
    <h3>识别结果 <span class="muted" id="resCount"></span></h3>
    <div class="muted" id="resHint" style="margin-bottom:8px"></div>
    <div class="grid2" id="resGrid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="commitBtn">确认入库</button>
      <button class="btn ghost mini" onclick="clearResult()">重新识别</button>
    </div>
  </div>
  <div class="card">
    <h3>记录</h3>
    <div id="notices"></div>
  </div>
</div>

<!-- ========== 市场 ========== -->
<div class="view hidden" id="v-market">
  <div class="card">
    <div class="row">
      <select id="fType" style="flex:1;min-width:110px"><option value="">全部类型</option></select>
      <select id="fLevel" style="width:110px"><option value="">全部等级</option></select>
      <input id="fBonus" type="number" placeholder="加成≥%" style="width:96px">
    </div>
  </div>
  <div id="marketList"></div>
</div>

<!-- ========== 匹配 ========== -->
<div class="view hidden" id="v-match">
  <div class="card">
    <h3>谁有我要的</h3>
    <div id="wantList"></div>
  </div>
  <div class="card">
    <h3>我能满足谁</h3>
    <div id="offerList"></div>
  </div>
</div>

<!-- ========== 意向箱 ========== -->
<div class="view hidden" id="v-inbox">
  <div class="card"><h3>收到的意向</h3><div id="inList"></div></div>
  <div class="card"><h3>我发出的意向</h3><div id="outList"></div></div>
</div>

<!-- ========== 图鉴 ========== -->
<div class="view hidden" id="v-catalog">
  <div class="card">
    <h3>等级 × 颜色对照 <span class="muted" id="catCount" style="font-size:12px"></span></h3>
    <div id="catGrid"></div>
    <h3 class="sect" style="margin:18px 0 8px;font-size:14px">量子图纸（暗物质 / 光物质）</h3>
    <div id="bpGrid" class="bpgrid"></div>
  </div>
</div>

<!-- ========== 我的 ========== -->
<div class="view hidden" id="v-mine">
  <div class="card">
    <h3>发布需求</h3>
    <div class="grid3">
      <div><label class="f">类型</label><select id="nType"></select></div>
    </div>
    <div class="grid2" style="margin-top:2px">
      <div><label class="f">最低等级</label><input id="nLv" type="number" value="11" min="0" max="20"></div>
      <div><label class="f">最低加成 %</label><input id="nBonus" type="number" value="360" step="1"></div>
    </div>
    <label class="f">备注</label><input id="nNote" placeholder="备注">
    <div style="margin-top:10px"><button class="btn" onclick="postNeed()">发布需求</button></div>
  </div>
  <div class="card">
    <h3>我的联系方式</h3>
    <div class="grid3">
      <div><label class="f">QQ号</label><input id="cQQ" placeholder="例如 12345678"></div>
      <div><label class="f">Discord</label><input id="cDiscord" placeholder="例如 yourname#1234"></div>
      <div><label class="f">常驻集团</label><input id="cCorp" placeholder="例如 [ABC] 集团名"></div>
    </div>
    <div style="margin-top:10px"><button class="btn" onclick="saveContact()">保存联系方式</button>
      <span class="muted" id="cHint" style="font-size:12px;margin-left:8px"></span></div>
  </div>
  <div class="card"><h3>我的条目 <span style="float:right"><button class="btn ghost mini" onclick="addManual()">+ 手动添加</button> <button class="btn ghost mini" onclick="clearMine()">一键清空</button></span></h3><div id="mineList"></div></div>
  <div class="card"><h3>我的需求</h3><div id="myNeedList"></div></div>
</div>
</div>

<div class="toast" id="toast"></div>

<dialog id="dlgTrade">
  <h3 style="margin:0 0 10px;font-size:15px">发起意向</h3>
  <div id="dlgTarget" class="muted" style="margin-bottom:10px"></div>
  <label class="f">我拿什么换（可选）</label>
  <select id="dlgGive"><option value="">不指定</option></select>
  <label class="f">留言</label>
  <textarea id="dlgMsg" rows="2" placeholder="说句话，比如约什么时候交易"></textarea>
  <div class="row" style="margin-top:12px;justify-content:flex-end">
    <button class="btn ghost mini" onclick="dlgTrade.close()">取消</button>
    <button class="btn" id="dlgSend">发送意向</button>
  </div>
</dialog>

<dialog id="dlgEdit">
  <h3 style="margin:0 0 10px;font-size:15px">修正条目</h3>
  <label class="f">类型</label><select id="eType"></select>
  <div class="grid2">
    <div><label class="f">等级</label><input id="eLevel" type="number"></div>
    <div><label class="f">加成 %</label><input id="eBonus" type="number"></div>
  </div>
  <label class="f">量子图纸</label><div id="eBp" class="bpick"></div>
  <div class="row" style="margin-top:12px;justify-content:flex-end">
    <button class="btn ghost mini" onclick="dlgEdit.close()">取消</button>
    <button class="btn" id="eSave">保存</button>
  </div>
</dialog>

<dialog id="dlgAuth">
  <h3 style="margin:0 0 4px;font-size:15px" id="authTitle">登录</h3>
  <div class="muted" style="margin-bottom:10px">用游戏名 + 账号密码进入，别用你在别处用过的密码。</div>
  <div class="row" style="gap:6px;margin-bottom:12px">
    <button class="btn mini" id="tabLogin" onclick="authMode('login')">登录</button>
    <button class="btn ghost mini" id="tabReg" onclick="authMode('reg')">注册新成员</button>
  </div>
  <div id="loginBox">
    <label class="f">账号</label><input id="lLogin" autocomplete="username" placeholder="拼音/英文都行">
    <label class="f">密码</label><input id="lPw" type="password" autocomplete="current-password">
  </div>
  <div id="regBox" class="hidden">
    <label class="f">游戏名（集团里显示的名字）</label><input id="rName" placeholder="例如 忆灵">
    <label class="f">账号</label><input id="rLogin" autocomplete="username" placeholder="字母数字，登录用">
    <label class="f">密码</label><input id="rPw" type="password" autocomplete="new-password" placeholder="至少 6 位">
    <label class="f">再输一次密码</label><input id="rPw2" type="password" autocomplete="new-password">
    <div class="muted" style="margin-top:6px">名字已在名单里的（忆灵 / CannonM / 洋芋 / 龙神天 等），注册时直接填自己的游戏名即可认领原有条目。</div>
  </div>
  <div class="row" style="margin-top:14px;justify-content:flex-end">
    <button class="btn ghost mini" onclick="dlgAuth.close()">取消</button>
    <button class="btn" id="authGo">登录</button>
  </div>
</dialog>

<script src="tess/tesseract.min.js"></script>
<div class="muted" id="ver" style="text-align:center;font-size:11px;opacity:.6;margin:18px 0 8px">云端 AI 识别 v2026.11.26.CLDA-OLD</div>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<script src="recog.js?v=20261126CLD9"></script>
<script src="ocr_ai.js?v=20261126CLD9"></script>
<script src="app.js?v=20261126CLD9"></script>
</body>
</html>
